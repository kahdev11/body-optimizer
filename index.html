<!DOCTYPE html>
<html lang="nb" data-theme="health" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Body Optimizer</title>
  <meta name="description" content="Trening, helse og skadeforebygging – tilbake på håndballbanen.">

  <!-- PWA / iPhone Hjem-skjerm -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F2F2F7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Optimizer">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <meta name="format-detection" content="telephone=no">

  <!-- Setter designvariant og lys/mørk før første tegning (unngår blink). -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('bo-appearance') || '{}');
        var d = document.documentElement;
        var m = s.mode || 'auto';
        d.dataset.theme = s.theme || 'health';
        d.dataset.mode = m === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : m;
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <main id="app" aria-live="off"></main>

  <div id="update-banner" class="update-banner" role="status" hidden></div>

  <nav id="tabbar" class="tabbar" aria-label="Hovedmeny"></nav>

  <noscript><p style="padding:24px">Body Optimizer trenger JavaScript for å fungere.</p></noscript>

  <script src="version.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
